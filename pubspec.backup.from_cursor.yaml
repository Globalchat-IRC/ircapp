name: irc_app_backup_cursor
description: "Backup generado automáticamente por Cursor con dependencias usadas en el código."
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.0
  intl: ^0.19.0

  # Dependencias restauradas porque el código las usa
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  crypto: ^3.0.6
  pasteboard: ^0.4.0
  just_audio: ^0.9.39
  audio_session: ^0.1.25
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true








