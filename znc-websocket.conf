<VirtualHost *:2002>
    ServerName ceres.globalchat.org
    
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ceres.globalchat.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ceres.globalchat.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:4443/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://127.0.0.1:4443/$1 [P,L]
    
    ProxyPass / http://127.0.0.1:4443/
    ProxyPassReverse / http://127.0.0.1:4443/
    
    ProxyTimeout 86400
</VirtualHost>
