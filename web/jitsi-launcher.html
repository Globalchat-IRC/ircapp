<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoconferencia GlobalChat</title>
    <script src="https://video.globalchat.org/external_api.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        #jitsi-container {
            width: 100vw;
            height: 100vh;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        .loading-spinner {
            border: 4px solid #333;
            border-top: 4px solid #ff6b35;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>Cargando videoconferencia...</p>
    </div>
    <div id="jitsi-container"></div>
    <script>
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || urlParams.get('roomName');
        const displayName = urlParams.get('displayName') || urlParams.get('name') || 'Usuario';
        
        if (!roomName) {
            document.body.innerHTML = '<div style="padding: 20px; text-align: center;"><h1>Error</h1><p>No se especificó el nombre de la sala.</p></div>';
        } else {
            // Configurar Jitsi Meet con la API externa
            const domain = 'video.globalchat.org';
            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#jitsi-container'),
                userInfo: {
                    displayName: decodeURIComponent(displayName)
                },
                configOverwrite: {
                    prejoinPageEnabled: false,
                    requireDisplayName: false,
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    disableDeepLinking: false
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                        'fodeviceselection', 'hangup', 'profile', 'chat', 'recording',
                        'livestreaming', 'etherpad', 'sharedvideo', 'settings', 'raisehand',
                        'videoquality', 'filmstrip', 'invite', 'feedback', 'stats', 'shortcuts',
                        'tileview', 'videobackgroundblur', 'download', 'help', 'mute-everyone',
                        'security'
                    ]
                }
            };
            
            try {
                const api = new JitsiMeetExternalAPI(domain, options);
                
                // Ocultar loading cuando se cargue
                api.addEventListener('videoConferenceJoined', () => {
                    const loading = document.getElementById('loading');
                    if (loading) {
                        loading.style.display = 'none';
                    }
                });
                
                // Manejar errores
                api.addEventListener('readyToClose', () => {
                    window.close();
                });
                
            } catch (error) {
                console.error('Error al inicializar Jitsi Meet:', error);
                document.body.innerHTML = '<div style="padding: 20px; text-align: center;"><h1>Error</h1><p>No se pudo cargar la videoconferencia. Por favor, verifica tu conexión.</p></div>';
            }
        }
    </script>
</body>
</html>
