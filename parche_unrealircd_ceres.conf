# Parche de configuración para UnrealIRCd en Ceres/Apolo
# Añade esto a tu unrealircd.conf para evitar detección de bots y antirandom

# OPCIÓN 1: Excepción específica para GlobalChat-* (RECOMENDADO)
except {
    mask "GlobalChat-*!*@*";
    
    /* Desactivar detección de bots */
    bot-tag {
        enabled no;
        reason "IRC App - Cliente oficial";
    };
    
    /* Desactivar antirandom */
    antirandom {
        enabled no;
        reason "IRC App - Cliente oficial";
    };
};

