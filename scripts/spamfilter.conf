/*
 * GlobalChat — reglas spamfilter (maestro: ceres)
 * Sincroniza a apolo/caliope vía sync-irc-conf.sh
 *
 * Orden: whitelist → malware (kill/gline) → canal+privado (soft-block)
 * soft-block: solo afecta a usuarios NO identificados (SASL/NickServ pasan)
 */

/* ========== 1. WHITELIST ========== */

spamfilter {
	match-type regex;
	target { channel; private; };
	action stop;
	reason "GlobalChat Cloudinary OK";
	match 'res\.cloudinary\.com/dxwvhgy2r/';
}

/* ========== 2. MALWARE / EXPLOITS ========== */

spamfilter {
	match-type regex;
	match '\x01DCC (SEND|RESUME)[ ]+\"(.+ ){20}';
	target { channel; private; };
	action kill;
	reason "mIRC 6.0-6.11 exploit attempt";
}

spamfilter {
	match-type regex;
	match '\x01DCC (SEND|RESUME).{225}';
	target { channel; private; };
	action kill;
	reason "Possible mIRC 6.12 exploit attempt";
}

spamfilter {
	match-type regex;
	match '^Want To Be An IRCOp\? Try This New Bug Type: //write \$decode\(.+=.?,m\) \| \.load -rs \$decode\(.+=.?,m\)$';
	target private;
	action block;
	reason "mIRC trojan decode exploit";
}

spamfilter {
	match-type simple;
	match 'STOP SPAM, USE THIS COMMAND: //write nospam $decode(*) | .load -rs nospam | //mode $me +R';
	target private;
	action gline;
	ban-time 1d;
	reason "nkie worm";
}

spamfilter {
	match-type simple;
	match 'Come watch me on my webcam and chat /w me :-) http://*:*/me.mpg';
	target private;
	action gline;
	ban-time 1d;
	reason "fyle trojan webcam spam";
}

spamfilter {
	match-type regex;
	match '(^wait a minute plz\. i am updating my site|.*my erotic video).*http://.+/erotic(a)?/myvideo\.exe$';
	target private;
	action gline;
	ban-time 1d;
	reason "erotic trojan exe";
}

spamfilter {
	match-type regex;
	match '^!login Wasszup!$';
	target channel;
	action gline;
	ban-time 1d;
	reason "GTBot login attempt";
}

spamfilter {
	match-type regex;
	match '^!packet ([0-9]{1,3}\.){3}[0-9]{1,3} [0-9]{1,15}';
	target channel;
	action gline;
	ban-time 1d;
	reason "GTBot packet flood";
}

spamfilter {
	match-type simple;
	match 'C:\\WINNT\\system32\\*.zip';
	target dcc;
	action block;
	reason "Gaggle worm DCC";
}

spamfilter {
	match-type regex;
	match 'C:\\\\WINNT\\\\system32\\\\(notes|videos|xxx|ManualSeduccion|postal|hechizos|images|sex|avril)\.zip';
	target dcc;
	action dccblock;
	reason "Gaggle worm DCC filename";
}

/* ========== 3. CANAL + PRIVADO (soft-block) ========== */

/* URLs genéricas excepto Cloudinary */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam URL";
	match '(?:(?:https?://(?!res\.cloudinary\.com/dxwvhgy2r/)|www\.(?!res\.cloudinary\.com/dxwvhgy2r/))[^\s]+)';
}

/* Acortadores de URL */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam URL shortener";
	match '(?i)(?:https?://)?(?:www\.)?(?:bit\.ly|tinyurl\.com|t\.co|goo\.gl|cutt\.ly|rb\.gy|is\.gd|shorturl\.at|ow\.ly|buff\.ly)/\S+';
}

/* Discord invites */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam Discord invite";
	match '(?i)(?:discord\.gg|discord(?:app)?\.com/invite)/\S+';
}

/* Telegram / WhatsApp */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam Telegram/WhatsApp";
	match '(?i)(?:t\.me|telegram\.me|wa\.me|chat\.whatsapp\.com)/\S+';
}

/* Teléfonos en mensajes */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "No compartir telefonos";
	match '(?:^|[\s,;:])\+?\d{1,4}[\s.-]?\(?\d{1,4}\)?[\s.-]?\d{3,4}[\s.-]?\d{3,4}(?:$|[\s,;:!.?])';
}

/* IRC Hispano (red competidora) */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Link IRC Hispano bloqueado";
	match '\b(?:https?|ftp)://(?:www\.)?irc-hispano\.org\b';
}

/* Spam unicode / drone */
spamfilter {
	match-type regex;
	target { channel; private; private-notice; channel-notice; topic; };
	action soft-block;
	reason "Spam drone unicode";
	match '([\x{2580}-\x{259F}]{3,}|s\s*\*\s*am\s+word|s\s+pam\s+word)';
}

/* GTBot comando cp suelto */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam GTBot";
	match '\bcp\b';
}

/* Redes/canales IRC competidores */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam red IRC competidora";
	match '(?i)(?:dalechat|chatzona|chatargentino|universochat|vivechat|redhispana|latinchat|irc[\s-]?hispano|dal[\s.]?net|chateamos|hispana\.org|unionhispana|misiochat|paranachat|elchat\.com|gentechat|buenchat|terrachat|chatsfriends|chatz\.com|viciochat|grupochat|supernets|chatarg|dalechatea)';
}

/* Cripto-estafa */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam cripto";
	match '(?i)(?:bitcoin|btc|ethereum|\beth\b|seed[\s-]?phrase|airdrop|wallet[\s-]?recover|send[\s-]?btc|binance[\s-]?bonus|usdt[\s-]?free|crypto[\s-]?giveaway)';
}

/* OnlyFans / adult spam */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam adulto";
	match '(?i)(?:onlyfans\.com|fans\.ly|subscribe.*onlyfans|premium[\s-]?snapchat)';
}

/* Phishing */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam phishing";
	match '(?i)(?:paypal.*verify|account.*suspend|confirm.*password.*https?|sign[\s-]?in.*required.*http|unusual[\s-]?activity.*http)';
}

/* Trabajo/ganar dinero + URL */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam estafa dinero";
	match '(?i)(?:earn[\s\$]|work[\s-]?from[\s-]?home|make[\s-]?money[\s-]?fast|gana[\s-]?dinero).*https?';
}

/* Steam phishing typos */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam Steam phishing";
	match '(?i)(?:steamcommunty|steamcommuity|steamncommunity|steampowered\.com[^\s]*(?:gift|free))';
}

/* Temu / marketplace spam */
spamfilter {
	match-type regex;
	target { channel; private; };
	action soft-block;
	reason "Spam marketplace";
	match '(?i)\btemu\b';
}
